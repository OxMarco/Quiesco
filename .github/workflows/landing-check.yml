# Type-checks and builds landing/ on pull requests, so a broken page never reaches main.
name: Check landing page

on:
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
